name: promptvideo

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-promptvideo}
      POSTGRES_USER: ${POSTGRES_USER:-promptvideo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promptvideo_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory
      # (/var/lib/postgresql/18/docker), so the mount belongs one level up at
      # /var/lib/postgresql. Mounting /var/lib/postgresql/data is the pre-18
      # layout and makes the container refuse to start.
      - promptvideo-postgres:/var/lib/postgresql

volumes:
  promptvideo-postgres:
